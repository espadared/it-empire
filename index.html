<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0E1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>IT Empire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <header id="topbar">
    <div class="tb-row1">
      <div class="lvl-badge"><b id="lvlNum">1</b><span>LEVEL</span></div>
      <div class="tb-name">
        <h1 id="pName">JASON</h1>
        <p id="pTitle">JUNIOR IT TECHNICIAN</p>
        <div class="tb-rank" id="pRank">Nobody Knows You</div>
      </div>
      <button class="help" id="help" aria-label="What is this screen?">?</button>
      <button class="bell" id="bell" aria-label="Notifications">🔔<span class="dot" id="bellDot" style="display:none"></span></button>
    </div>
    <div class="tb-res">
      <div class="res credits"><i>💰</i><span class="v" id="resCredits">0</span><em>credits</em></div>
      <div class="res rep"><i>🏆</i><span class="v" id="resRep">0</span><em>reputation</em></div>
      <div class="res"><i>⭐</i><div class="bar xp"><span id="xpFill" style="width:0%"></span></div><span class="lbl" id="xpLbl">0/0</span><em>to next level</em></div>
      <div class="res allow" id="resAllow"><i>🎫</i><div class="bar energy"><span id="enFill" style="width:100%"></span></div><span class="lbl" id="enLbl">0/0</span><em>tickets left</em></div>
    </div>
  </header>

  <main id="screens">

    <!-- ========== HQ ========== -->
    <section class="screen on" id="screen-hq">
      <div class="stage" id="stage"><div class="meters" id="meters"></div></div>
      <div class="queue" id="queue"></div>
      <div class="dock"><div class="mini-row" id="miniRow"></div></div>
      <div class="idle-strip" id="idleStrip"></div>
      <div class="goal-strip" id="goalStrip"></div>
      <div class="coop-strip" id="coopStrip"></div>
      <div class="sec-head"><h2>EXPANSION</h2><span>THE EMPIRE</span></div>
      <div id="expandCard"></div>
      <div class="sec-head"><h2>THE OFFICE</h2><span>UPGRADES</span></div>
      <div class="list" id="buildList"></div>
      <div style="height:14px"></div>
    </section>

    <section class="screen" id="screen-staff"></section>
    <section class="screen" id="screen-gear"></section>
    <section class="screen" id="screen-missions"></section>
    <section class="screen" id="screen-rank"></section>
    <section class="screen" id="screen-battle"></section>

  </main>

  <nav id="nav">
    <button data-screen="hq" class="on"><i>🏢</i>HQ</button>
    <button data-screen="staff"><i>👥</i>STAFF</button>
    <button data-screen="gear"><i>🎒</i>GEAR</button>
    <button data-screen="missions"><i>📋</i>MISSIONS<span class="badge" id="navBadge" style="display:none">0</span></button>
    <button data-screen="rank"><i>🏆</i>RANKING</button>
    <button data-screen="battle"><i>⚔️</i>BATTLE</button>
  </nav>

</div>

<div id="fx"></div>
<div id="modal"></div>
<div id="gate"></div>
<div id="splash"><div class="s-mark">🔧</div></div>

<script src="js/data.js"></script>
<script src="js/battle-data.js"></script>
<script src="js/art.js"></script>
<script src="js/net.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/battle.js"></script>
<script src="js/tutor.js"></script>
<script src="js/onboard.js"></script>
<script src="js/main.js"></script>
</body>
</html>
