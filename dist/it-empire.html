<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0E1220">
<title>IT Empire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   IT EMPIRE — a helpdesk at dusk.
   Single committed visual world (dark office). Every colour explicit.
   ============================================================ */

:root{
  --ink:#0E1220; --ink-2:#0A0E1A;
  --panel:#1A2136; --panel-2:#232C46; --panel-3:#2C3552;
  --line:#333D5E;
  --lamp:#FFB347; --lamp-dim:#8A6230;
  --crt:#4FD6C9; --crt-dim:#2C6E68;
  --alarm:#FF5A5F; --rep:#C08BFF; --good:#5FD37A;
  --text:#E8ECF7; --muted:#8A93AD; 
  --faint:#5C6480;
  --r-common:#8A93AD; --r-uncommon:#5FD37A; --r-rare:#4FA8FF;
  --r-epic:#B67CFF; --r-legendary:#FFB347; --r-mythic:#FF5A9E;
  --shadow:0 8px 24px rgba(0,0,0,.45);
  --disp:'Baloo 2',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink-2); color:var(--text);
  font-family:var(--body); font-size:15px; line-height:1.45;
  overscroll-behavior:none; -webkit-font-smoothing:antialiased;
  /* Kills double-tap-to-zoom, which fires when you tap two tickets quickly.
     iOS has ignored user-scalable=no since iOS 10, so the meta tag alone does
     nothing. Pinch-to-zoom is deliberately left working — that is somebody's
     accessibility, not a misfire. */
  touch-action: manipulation;
}
button, .card, .tk, .act, .slot, .issue-slot, .sortchip, .seg-btn, .chip,
.dchip-row, .crew, .postopt, .diag-opt, .bopt, .led-btn, .cfgline, .spec,
.sw, .pill, .inc-opt, .dpick, #nav button{
  touch-action: manipulation;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--crt);outline-offset:2px;border-radius:8px}

/* ---------- SHELL ---------- */
#app{
  position:relative; width:100%; max-width:480px; margin:0 auto;
  height:100dvh; max-height:100dvh;
  background:var(--ink); display:flex; flex-direction:column; overflow:hidden;
}
@media (min-width:520px){
  body{background:radial-gradient(1200px 700px at 50% -10%,#1B2138,#06080F 70%)}
  #app{box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.6)}
}

/* ---------- TOP BAR ---------- */
#topbar{
  position:sticky; top:0; z-index:40; flex:0 0 auto;
  background:linear-gradient(180deg,#1C2340 0%,rgba(20,26,45,.96) 100%);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 9px;
  backdrop-filter:blur(8px);
}
.tb-row1{display:flex;align-items:center;gap:10px}
.lvl-badge{
  flex:0 0 auto;width:46px;height:46px;border-radius:14px;
  background:linear-gradient(160deg,var(--lamp),#E07C2B);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 3px 0 #8A4E17, inset 0 1px 0 rgba(255,255,255,.4);
  color:#2A1704;
}
.lvl-badge b{font-family:var(--disp);font-size:19px;line-height:.95;font-weight:800}
.lvl-badge span{font-size:8px;font-weight:800;letter-spacing:.1em}
.tb-name{flex:1 1 auto;min-width:0}
.tb-name h1{
  font-family:var(--disp);font-weight:800;font-size:17px;margin:0;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tb-name p{margin:1px 0 0;font-size:11px;color:var(--lamp);font-weight:700;letter-spacing:.02em}
.tb-rank{font-size:10px;color:var(--muted);letter-spacing:.04em}
.bell{
  position:relative;width:38px;height:38px;border-radius:12px;background:var(--panel-2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:16px;flex:0 0 auto;
}
.bell .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--alarm);box-shadow:0 0 0 2px var(--panel-2)}

.tb-res{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.res{
  display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:5px 8px;min-width:0;
}
.res i{font-style:normal;font-size:13px;flex:0 0 auto}
.res .v{font-family:var(--mono);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res.credits .v{color:var(--lamp)} .res.rep .v{color:var(--rep)}
.bar{position:relative;flex:1 1 auto;height:9px;border-radius:5px;background:#0E1322;overflow:hidden;border:1px solid #0A0E1A}
.bar>span{display:block;height:100%;border-radius:5px;transition:width .45s cubic-bezier(.2,.9,.3,1)}
.bar.xp>span{background:linear-gradient(90deg,#3FA9C9,var(--crt))}
.bar.energy>span{background:linear-gradient(90deg,#C98A2B,#FFD37A)}
.res .lbl{font-family:var(--mono);font-size:10px;color:var(--muted);flex:0 0 auto;font-variant-numeric:tabular-nums}

/* ---------- SCREENS ---------- */
#screens{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.screen{display:none;animation:fadeIn .22s ease both}
.screen.on{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.sec-head{display:flex;align-items:baseline;gap:8px;padding:16px 14px 6px}
.sec-head h2{font-family:var(--disp);font-weight:800;font-size:16px;margin:0;letter-spacing:.02em}
.sec-head span{font-size:11px;color:var(--muted);margin-left:auto;font-family:var(--mono)}

/* ---------- HQ STAGE ---------- */
.stage{position:relative;isolation:isolate;overflow:hidden;background:var(--ink-2);
  height:clamp(94px,14dvh,150px)}
.office-svg{display:block;width:100%;height:100%}
.stage::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 30%,transparent 40%,rgba(6,9,17,.75) 100%);
}
.hero-wrap{
  position:absolute;left:52%;bottom:14px;transform:translateX(-50%);
  height:70%;z-index:2;filter:drop-shadow(0 14px 18px rgba(0,0,0,.55));
}
.hero-svg{display:block;height:100%;width:auto}
.hero-shadow{
  position:absolute;left:52%;bottom:11px;transform:translateX(-50%);
  width:34%;height:15px;background:radial-gradient(closest-side,rgba(0,0,0,.65),transparent);z-index:1;
}
.hero-name{
  position:absolute;left:10px;bottom:8px;z-index:3;max-width:42%;
}
.hero-name .n{font-family:var(--disp);font-weight:800;font-size:18px;line-height:1;text-shadow:0 2px 6px #000}
.hero-name .r{font-size:10.5px;color:var(--lamp);font-weight:700;text-shadow:0 1px 4px #000}
.hero-name .p{
  display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-family:var(--mono);font-size:10px;
  background:rgba(10,14,26,.8);border:1px solid var(--line);border-radius:8px;padding:2px 6px;color:var(--crt);
}
.hero-say{
  position:absolute;right:8px;bottom:10px;z-index:3;max-width:44%;
  background:rgba(232,236,247,.94);color:#141A2B;border-radius:12px 12px 12px 3px;
  padding:6px 9px;font-size:11px;font-weight:700;line-height:1.25;box-shadow:var(--shadow);
}
.stage-chip{
  position:absolute;top:8px;left:8px;z-index:3;display:flex;gap:5px;flex-wrap:wrap;max-width:calc(100% - 146px);
}
.chip{
  display:inline-flex;align-items:center;gap:4px;background:rgba(12,16,29,.85);border:1px solid var(--line);
  border-radius:999px;padding:2px 8px;font-size:9.5px;font-weight:800;letter-spacing:.03em;backdrop-filter:blur(4px);
}
.chip.live{border-color:var(--crt);color:var(--crt)}
.chip.event{border-color:var(--lamp);color:var(--lamp);animation:pulseGlow 1.8s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,179,71,.35)}50%{box-shadow:0 0 0 6px rgba(255,179,71,0)}}

/* ---------- TICKET CARD ---------- */
.ticket{
  margin:-26px 12px 0;position:relative;z-index:5;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow);
}
.ticket.crit{border-color:var(--alarm);box-shadow:0 0 0 1px var(--alarm),0 10px 30px rgba(255,90,95,.25)}
.tk-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tk-id{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.04em}
.tk-stars{margin-left:auto;font-size:11px;letter-spacing:1px;color:var(--lamp)}
.tk-main{display:flex;gap:10px;align-items:flex-start}
.tk-icon{
  width:46px;height:46px;flex:0 0 auto;border-radius:13px;display:grid;place-items:center;font-size:23px;
  background:var(--ink-2);border:1px solid var(--line);
}
.tk-body{min-width:0;flex:1}
.tk-name{font-family:var(--disp);font-weight:800;font-size:16px;line-height:1.15;margin:0}
.tk-flav{font-size:11.5px;color:var(--muted);margin:3px 0 0;line-height:1.3}
.tk-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{
  font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:7px;padding:2px 6px;color:var(--muted);background:var(--ink-2);
}
.tag.stat{color:var(--crt);border-color:var(--crt-dim)}
.tag.odds{color:var(--lamp);border-color:var(--lamp-dim)}
.tk-rewards{display:flex;gap:10px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-family:var(--mono);font-size:11px}
.tk-rewards b{font-weight:600}
.rw-c{color:var(--lamp)} .rw-x{color:var(--crt)} .rw-r{color:var(--rep)}

/* ---------- BIG ACTION ---------- */
.dock{padding:12px 12px 4px}
.resolve{
  width:100%;border-radius:20px;padding:16px 14px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#FFC46A,#F0912C 60%,#D9741B);
  color:#31190A;font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:.02em;
  box-shadow:0 6px 0 #A9560F, 0 12px 26px rgba(240,145,44,.32), inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .09s ease, box-shadow .09s ease;
  display:flex;align-items:center;justify-content:center;gap:9px;
}
.resolve:active{transform:translateY(5px);box-shadow:0 1px 0 #A9560F,0 4px 12px rgba(240,145,44,.3),inset 0 1px 0 rgba(255,255,255,.4)}
.resolve .sub{display:block;font-family:var(--mono);font-size:10px;font-weight:600;opacity:.75;letter-spacing:.06em}
.resolve::after{
  content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);
  animation:sheen 3.4s ease-in-out infinite;
}
@keyframes sheen{0%,60%{left:-60%}100%{left:130%}}
.resolve.tired{background:linear-gradient(180deg,#8C93A8,#5F677E);box-shadow:0 6px 0 #3B4257}
.resolve.tired{box-shadow:0 6px 0 #3B4257,0 10px 20px rgba(0,0,0,.3)}
.mini-row{display:flex;gap:8px;margin-top:9px}
.mini{
  flex:1;border-radius:14px;padding:9px 6px;background:var(--panel);border:1px solid var(--line);
  font-family:var(--disp);font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:transform .08s ease,border-color .15s;
}
.mini:active{transform:scale(.96)}
.mini i{font-style:normal;font-size:17px}
.mini small{font-family:var(--mono);font-size:9px;color:var(--muted);font-weight:600}
.mini.hot{border-color:var(--alarm);color:var(--alarm);animation:pulseRed 1.4s infinite}
@keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(255,90,95,.4)}50%{box-shadow:0 0 0 7px rgba(255,90,95,0)}}
.mini.ready{border-color:var(--good);color:var(--good)}

/* ---------- IDLE STRIP ---------- */
.idle-strip{
  margin:12px 12px 0;border-radius:16px;border:1px solid var(--line);
  background:linear-gradient(135deg,#1D2740,#161C2E);padding:11px 12px;
}
.idle-head{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:800;font-size:13px}
.idle-head .live-dot{width:7px;height:7px;border-radius:50%;background:var(--good);animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.idle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
.idle-cell{background:var(--ink-2);border:1px solid var(--line);border-radius:11px;padding:7px;text-align:center}
.idle-cell b{display:block;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.idle-cell span{font-size:9px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.idle-note{margin-top:8px;font-size:11px;color:var(--muted)}
.collect{
  width:100%;margin-top:9px;border-radius:13px;padding:11px;font-family:var(--disp);font-weight:800;font-size:14px;
  background:linear-gradient(180deg,#63E08D,#2FA45E);color:#08210F;box-shadow:0 4px 0 #1D7442;
  transition:transform .08s ease;
}
.collect:active{transform:translateY(3px);box-shadow:0 1px 0 #1D7442}

/* ---------- GENERIC PANELS / CARDS ---------- */
.list{padding:0 12px;display:flex;flex-direction:column;gap:9px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:11px;
  display:flex;gap:10px;align-items:center;
}
.card.col{flex-direction:column;align-items:stretch}
.avatar{
  width:56px;height:56px;flex:0 0 auto;border-radius:15px;overflow:hidden;position:relative;
  background:radial-gradient(circle at 50% 20%,#2C3552,#161C2E);border:2px solid var(--line);
}
.avatar .portrait-svg{width:100%;height:100%;display:block}
.avatar.lg{width:74px;height:74px}
.avatar .lv{
  position:absolute;bottom:0;right:0;background:var(--ink-2);border-top-left-radius:8px;
  font-family:var(--mono);font-size:9px;padding:1px 4px;border-left:1px solid var(--line);border-top:1px solid var(--line);
}
.who{min-width:0;flex:1}
.who h3{font-family:var(--disp);font-weight:800;font-size:14.5px;margin:0;line-height:1.15}
.who .role{font-size:11px;color:var(--muted)}
.rar{
  display:inline-block;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.09em;
  padding:1.5px 6px;border-radius:6px;margin-top:4px;
}
.pw{font-family:var(--mono);font-size:11px;color:var(--lamp);font-variant-numeric:tabular-nums}
.btn{
  border-radius:12px;padding:9px 13px;font-family:var(--disp);font-weight:800;font-size:13px;
  background:var(--panel-3);border:1px solid var(--line);transition:transform .08s ease,filter .15s;
  white-space:nowrap;
}
.btn:active{transform:scale(.95)}
.btn.gold{background:linear-gradient(180deg,#FFC46A,#E68A26);color:#31190A;border:0;box-shadow:0 3px 0 #A9560F}
.btn.gold:active{transform:translateY(2px);box-shadow:0 1px 0 #A9560F}
.btn.teal{background:linear-gradient(180deg,#5FE4D6,#2A9C92);color:#062421;border:0;box-shadow:0 3px 0 #1B6A63}
.btn.ghost{background:transparent}
.btn:disabled,.btn.off{opacity:.42;filter:grayscale(.5)}
.btn.sm{padding:6px 10px;font-size:11.5px;border-radius:10px}
.row{display:flex;gap:8px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)} .tiny{font-size:11px} .mono{font-family:var(--mono)}
.pbar{height:7px;border-radius:4px;background:#0E1322;overflow:hidden;border:1px solid #0A0E1A}
.pbar>span{display:block;height:100%;background:linear-gradient(90deg,#3FA9C9,var(--crt));transition:width .4s}
.pbar.gold>span{background:linear-gradient(90deg,#C98A2B,var(--lamp))}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px 12px;margin-top:8px}
.statrow{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px}
.statrow b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.statrow .nm{color:var(--muted);font-size:9.5px;letter-spacing:.03em}

.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:12.5px}
.empty .big{font-size:34px;display:block;margin-bottom:8px;opacity:.6}

/* ---------- MISSIONS / ACHIEVEMENTS ---------- */
.mrow{display:flex;gap:10px;align-items:center}
.mrow .ico{width:38px;height:38px;border-radius:11px;background:var(--ink-2);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.mrow .txt{flex:1;min-width:0}
.mrow .txt h4{margin:0;font-family:var(--disp);font-weight:700;font-size:13px}
.mrow .prog{display:flex;align-items:center;gap:7px;margin-top:5px}
.mrow .prog .pbar{flex:1}
.mrow .prog span{font-family:var(--mono);font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rewrow{display:flex;gap:8px;margin-top:6px;font-family:var(--mono);font-size:10px;flex-wrap:wrap}
.ach{opacity:.45}
.ach.got{opacity:1;border-color:var(--lamp-dim)}

/* ---------- BOTTOM NAV ---------- */
#nav{
  position:sticky;bottom:0;z-index:40;flex:0 0 auto;display:grid;grid-template-columns:repeat(6,1fr);
  background:linear-gradient(180deg,rgba(20,26,45,.97),#141A2D);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
  backdrop-filter:blur(8px);
}
#nav button{
  padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;
  font-family:var(--disp);font-weight:700;font-size:9px;letter-spacing:.03em;color:var(--muted);
  transition:color .15s,transform .1s;
}
#nav button i{font-style:normal;font-size:19px;transition:transform .18s cubic-bezier(.3,1.4,.5,1);filter:grayscale(.6) opacity(.75)}
#nav button.on{color:var(--lamp)}
#nav button.on i{transform:translateY(-2px) scale(1.16);filter:none}
#nav button.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 4px 4px;background:var(--lamp)}
#nav button .badge{
  position:absolute;top:4px;right:calc(50% - 20px);min-width:15px;height:15px;border-radius:8px;background:var(--alarm);
  color:#fff;font-family:var(--mono);font-size:9px;display:grid;place-items:center;padding:0 3px;box-shadow:0 0 0 2px #141A2D;
}

/* ---------- FX LAYER ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.float{
  position:absolute;font-family:var(--disp);font-weight:800;font-size:17px;white-space:nowrap;
  text-shadow:0 2px 5px rgba(0,0,0,.7);animation:floatUp 1.15s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,0) scale(.6)}
  18%{opacity:1;transform:translate(-50%,-14px) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,-78px) scale(.95)}
}
.coin{position:absolute;width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FFE9A8,var(--lamp) 55%,#C9772A);
  box-shadow:0 0 8px rgba(255,179,71,.6)}
.spark{position:absolute;width:7px;height:7px;border-radius:2px;animation:sparkOut .7s ease-out forwards}
@keyframes sparkOut{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2) rotate(220deg)}}
.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.pop{animation:pop .32s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}

/* ---------- MODALS ---------- */
#modal{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;justify-content:center;
  background:rgba(4,7,14,.72);backdrop-filter:blur(3px);padding:0}
#modal.on{display:flex}
.sheet{
  width:100%;max-width:480px;background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:88dvh;overflow-y:auto;animation:slideUp .28s cubic-bezier(.2,.9,.3,1);box-shadow:0 -18px 50px rgba(0,0,0,.6);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{font-family:var(--disp);font-weight:800;font-size:19px;margin:0 0 3px;text-align:center}
.sheet .sub{text-align:center;color:var(--muted);font-size:12px;margin:0 0 12px}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet .cta{width:100%;margin-top:12px}
.reward-line{display:flex;justify-content:center;gap:14px;font-family:var(--mono);font-size:14px;margin:12px 0;flex-wrap:wrap}
.big-emoji{font-size:46px;text-align:center;display:block;margin-bottom:4px;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}

/* incident */
.inc-timer{height:8px;border-radius:4px;background:#0E1322;overflow:hidden;margin:10px 0}
.inc-timer>span{display:block;height:100%;background:linear-gradient(90deg,var(--alarm),#FF9A5F);transition:width .25s linear}
.inc-chance{font-family:var(--mono);font-size:12px;text-align:center;margin-bottom:10px}
.inc-opt{
  width:100%;text-align:left;border-radius:13px;padding:12px;margin-top:8px;
  background:var(--ink-2);border:1px solid var(--line);font-family:var(--disp);font-weight:700;font-size:14px;
  transition:transform .08s,border-color .15s;
}
.inc-opt:active{transform:scale(.98)}
.inc-opt.ok{border-color:var(--good);color:var(--good)}
.inc-opt.bad{border-color:var(--alarm);color:var(--alarm)}
.inc-steps{display:flex;gap:4px;justify-content:center;margin-bottom:8px}
.inc-steps i{width:22px;height:4px;border-radius:2px;background:var(--line);font-style:normal}
.inc-steps i.ok{background:var(--good)} .inc-steps i.bad{background:var(--alarm)}

/* slot grid */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.slot{
  border-radius:13px;border:1px dashed var(--line);background:var(--ink-2);padding:8px 6px;text-align:center;
  transition:border-color .15s;
}
.slot.filled{border-style:solid}
.slot .si{font-size:19px} 
.slot .sn{font-family:var(--mono);font-size:8.5px;color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* world */
.loc{display:flex;gap:10px;align-items:center;opacity:.5}
.loc.open{opacity:1}
.loc .flag{font-size:26px;width:44px;height:44px;display:grid;place-items:center;background:var(--ink-2);border-radius:13px;border:1px solid var(--line)}

/* ambient svg animation */
.led{animation:ledBlink 1.9s steps(1,end) infinite}
@keyframes ledBlink{0%,55%{opacity:1}56%,100%{opacity:.18}}
.lamp{animation:lampPulse 4.5s ease-in-out infinite}
@keyframes lampPulse{0%,100%{opacity:.9}50%{opacity:1}}
.scan{animation:scanMove 3.2s linear infinite}
@keyframes scanMove{0%{transform:translateY(0)}100%{transform:translateY(18px)}}
.steam{animation:steamRise 3s ease-in-out infinite}
@keyframes steamRise{0%{opacity:0;transform:translateY(2px)}40%{opacity:.6}100%{opacity:0;transform:translateY(-8px)}}
.head-bob{animation:bob 3.4s ease-in-out infinite;transform-origin:80px 88px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2px) rotate(.8deg)}}
.eyes{animation:blinkEyes 5.6s infinite}
@keyframes blinkEyes{0%,96%,100%{transform:scaleY(1)}98%{transform:scaleY(.1)}}
.eyes{transform-origin:80px 61px}
.arm-idle-r{animation:armIdle 3.4s ease-in-out infinite}
.arm-idle-l{animation:armIdle 3.4s ease-in-out infinite reverse}
@keyframes armIdle{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
.arm-work-r{animation:armWork .26s ease-in-out infinite}
.arm-work-l{animation:armWork .26s ease-in-out infinite reverse}
@keyframes armWork{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}
.hero-wrap.working{animation:workBounce .26s ease-in-out infinite}
@keyframes workBounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3px)}}

@media (prefers-reduced-motion:reduce){
  *,*::after,*::before{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}

/* working pose overrides (applied while a ticket is being resolved) */
.hero-wrap.working .arm-idle-r,.hero-wrap.working .arm-work-r{animation:armWork .24s ease-in-out infinite}
.hero-wrap.working .arm-idle-l,.hero-wrap.working .arm-work-l{animation:armWork .24s ease-in-out infinite reverse}
.hero-wrap.working .head-bob{animation:bob .5s ease-in-out infinite}
.dock{padding:9px 12px 4px}
.toast{
  /* Purely informational, and it floats right over the bottom ticket's
     buttons — it must never swallow a tap meant for the queue. */
  pointer-events:none;
  position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:65;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--lamp);
  border-radius:14px;padding:9px 14px;box-shadow:var(--shadow);display:flex;gap:9px;align-items:center;
  max-width:min(420px,92vw);animation:toastIn .35s cubic-bezier(.2,1.4,.4,1);
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%)}}
.toast .t1{font-family:var(--disp);font-weight:800;font-size:13px}
.toast .t2{font-size:11px;color:var(--muted)}

/* ============================================================
   THE GATE — sign in, and the character you build before you start
   ============================================================ */
#gate{
  position:fixed;inset:0;z-index:80;display:none;overflow-y:auto;
  background:
    radial-gradient(90% 55% at 50% 0%,#2A2352 0%,transparent 60%),
    radial-gradient(70% 40% at 80% 100%,#3A2340 0%,transparent 60%),
    var(--ink);
}
#gate.on{display:block}
.gate-inner{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 26px) 16px 26px}

.gate-logo{text-align:center;margin-bottom:20px}
.gate-logo.tight{margin:22px 0 10px}
.gate-mark{
  width:64px;height:64px;margin:0 auto 12px;border-radius:20px;display:grid;place-items:center;font-size:30px;
  background:linear-gradient(160deg,var(--lamp),#E07C2B);
  box-shadow:0 5px 0 #8A4E17,0 14px 34px rgba(240,145,44,.35);
  animation:markIn .5s cubic-bezier(.2,1.5,.4,1) both;
}
@keyframes markIn{from{transform:scale(.5) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
.gate-logo h1{
  font-family:var(--disp);font-weight:800;font-size:26px;margin:0;letter-spacing:.04em;
  background:linear-gradient(180deg,#FFE0B0,var(--lamp));-webkit-background-clip:text;background-clip:text;color:transparent;
}
.gate-logo.tight h1{font-size:17px;letter-spacing:.06em}
.gate-logo p{margin:5px 0 0;font-size:12.5px;color:var(--muted);line-height:1.4}

.gate-card{
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow);
}
.seg{display:flex;gap:6px;background:var(--ink-2);border-radius:13px;padding:4px;margin-bottom:14px}
.seg-btn{
  flex:1;border-radius:10px;padding:9px 6px;font-family:var(--disp);font-weight:800;font-size:12px;
  color:var(--muted);letter-spacing:.04em;transition:background .18s,color .18s;
}
.seg-btn.on{background:var(--panel-3);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.06)}
.fld{display:block;margin-bottom:11px}
.fld span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--muted);margin-bottom:5px}
.fld input{
  width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;
  padding:12px;color:var(--text);font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.02em;
}
.fld input::placeholder{color:var(--faint);font-weight:600;letter-spacing:0;font-size:14px}
.fld input:focus{outline:none;border-color:var(--lamp);box-shadow:0 0 0 3px rgba(255,179,71,.16)}
.fld.locked{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.fld.locked b{font-family:var(--disp);font-size:17px;letter-spacing:.02em}
.gate-err{min-height:16px;margin:2px 0 8px;font-size:12px;color:var(--alarm);text-align:center;font-weight:700}
.gate-err.shownow{animation:pop .3s}
.gate-note{margin:11px 0 0;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.45}
.gate-inner .cta{width:100%;margin-top:12px;display:block}
.cta.big{padding:15px;font-size:16px}

/* character preview */
.creator-stage{
  position:relative;height:216px;margin:14px 0;border-radius:20px;overflow:hidden;
  background:linear-gradient(180deg,#232B47,#131829);border:1px solid var(--line);
  display:flex;align-items:flex-end;justify-content:center;
}
.creator-glow{
  position:absolute;left:50%;bottom:-40px;transform:translateX(-50%);
  width:230px;height:150px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,201,122,.3),transparent);
}
.creator-svg{position:relative;height:98%;width:auto;filter:drop-shadow(0 12px 16px rgba(0,0,0,.5))}
.dice{position:absolute;top:9px;right:9px;background:rgba(12,16,29,.8);border:1px solid var(--line)}

.opt{display:flex;align-items:center;gap:9px;margin-top:11px;flex-wrap:wrap}
.opt-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--muted);width:46px;flex:0 0 auto}
.sws{display:flex;gap:6px;flex:1;min-width:0}
.sws.wrap{flex-wrap:wrap}
.sw{
  width:30px;height:30px;border-radius:10px;border:2px solid transparent;flex:0 0 auto;
  transition:transform .12s,border-color .12s;box-shadow:inset 0 -3px 6px rgba(0,0,0,.3);
}
.sw.on{border-color:var(--text);transform:scale(1.1)}
.pill{
  border-radius:10px;padding:7px 11px;background:var(--ink-2);border:1px solid var(--line);
  font-family:var(--disp);font-weight:700;font-size:12px;color:var(--muted);transition:all .15s;
}
.pill.on{border-color:var(--lamp);color:var(--lamp);background:rgba(255,179,71,.1)}

.spec-list{display:flex;flex-direction:column;gap:9px}
.spec{
  text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:12px;
  transition:border-color .18s,background .18s,transform .1s;width:100%;
}
.spec:active{transform:scale(.99)}
.spec.on{border-color:var(--lamp);background:linear-gradient(180deg,rgba(255,179,71,.09),var(--panel))}
.spec-top{display:flex;align-items:center;gap:10px}
.spec-ico{
  width:42px;height:42px;border-radius:13px;background:var(--ink-2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:21px;flex:0 0 auto;
}
.spec-top h3{font-family:var(--disp);font-weight:800;font-size:14.5px;margin:0}
.spec-tag{font-size:11px;color:var(--muted)}
.spec-tick{margin-left:auto;font-size:17px;color:var(--lamp);font-weight:800}
.spec-blurb{margin:9px 0 7px;font-size:12px;color:var(--muted);line-height:1.4;font-style:italic}
.spec-pro{font-size:11.5px;color:var(--good)}
.spec-con{font-size:11.5px;color:var(--alarm)}

/* leaderboard + account */
.lb-pos{
  width:24px;flex:0 0 auto;text-align:center;font-family:var(--disp);font-weight:800;font-size:15px;color:var(--muted);
}
.lb-pos.top{color:var(--lamp)}
.acct{
  display:flex;align-items:center;gap:10px;margin-top:12px;padding:11px;
  background:var(--ink-2);border:1px solid var(--line);border-radius:14px;
}
.acct b{font-family:var(--disp);font-size:15px}
.acct button{margin-left:auto;flex:0 0 auto}

/* boot splash while we work out whether there is a server behind this page */
#splash{
  position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:var(--ink);
  transition:opacity .3s;
}
#splash.gone{opacity:0;pointer-events:none}
#splash .s-mark{
  width:60px;height:60px;border-radius:19px;display:grid;place-items:center;font-size:28px;
  background:linear-gradient(160deg,var(--lamp),#E07C2B);animation:markPulse 1.3s ease-in-out infinite;
}
@keyframes markPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}

/* ============================================================
   THE QUEUE — three tickets, three clocks, one of you
   ============================================================ */
.meters{
  position:absolute;right:8px;top:8px;z-index:3;display:flex;flex-direction:column;gap:5px;width:126px;
}
.meter{
  display:flex;align-items:center;gap:6px;background:rgba(11,15,27,.82);border:1px solid var(--line);
  border-radius:999px;padding:3px 8px 3px 6px;backdrop-filter:blur(4px);
}
.meter.hot{border-color:var(--lamp);box-shadow:0 0 12px rgba(255,179,71,.35)}
.meter .m-lbl{font-size:11px;line-height:1}
.meter b{font-family:var(--mono);font-size:10px;color:var(--lamp);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.meter b.bad{color:var(--alarm)}
.mbar{flex:1;height:5px;border-radius:3px;background:#0A0E1A;overflow:hidden}
.mbar>span{display:block;height:100%;background:linear-gradient(90deg,#C9772A,var(--lamp));transition:width .3s}
.mbar.morale>span{background:linear-gradient(90deg,#3FA9C9,var(--crt))}

.queue{padding:8px 12px 10px;display:flex;flex-direction:column;gap:7px}
.tk{
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);border-radius:15px;padding:8px 10px;position:relative;overflow:hidden;
}
.tk.fresh{animation:tkIn .28s cubic-bezier(.2,1.2,.4,1) both}
@keyframes tkIn{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
.tk.hard{border-color:#5A3550}
.tk.urgent{border-color:var(--alarm);animation:tkPulse 1s ease-in-out infinite}
@keyframes tkPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,90,95,0)}50%{box-shadow:0 0 0 3px rgba(255,90,95,.18)}}
.tk.going{animation:tkOut .3s ease-in forwards}
@keyframes tkOut{to{opacity:0;transform:translateX(60px) scale(.95)}}
.tk-head{display:flex;align-items:center;gap:5px;margin-bottom:5px;flex-wrap:nowrap;overflow:hidden}
.tier{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.08em;
  border-radius:6px;padding:2px 6px;border:1px solid}
.t-EASY{color:var(--good);border-color:#2F6B41;background:rgba(95,211,122,.08)}
.t-MEDIUM{color:var(--lamp);border-color:var(--lamp-dim);background:rgba(255,179,71,.08)}
.t-HARD{color:var(--alarm);border-color:#7A2F33;background:rgba(255,90,95,.08)}
.tk-clock{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tk-clock.urgent{color:var(--alarm);font-weight:600}
.sla{height:4px;border-radius:2px;background:#0B0F1C;overflow:hidden;margin-bottom:7px}
.sla>span{display:block;height:100%;background:linear-gradient(90deg,var(--alarm),var(--lamp) 45%,var(--good));
  transition:width .25s linear}
.tk-row{display:flex;gap:9px;align-items:flex-start}
.tk-ico{width:36px;height:36px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;font-size:19px;
  background:var(--ink-2);border:1px solid var(--line)}
.tk-txt{min-width:0;flex:1}
.tk-txt h3{font-family:var(--disp);font-weight:800;font-size:14.5px;margin:0;line-height:1.15}
.tk-txt p{margin:2px 0 0;font-size:11.5px;color:var(--muted);line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tk-rw{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px;
  font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.tk-acts{display:flex;gap:7px;margin-top:7px}
.act{
  border-radius:11px;font-family:var(--disp);font-weight:800;font-size:12.5px;padding:8px;
  transition:transform .08s ease,filter .15s;display:flex;align-items:center;justify-content:center;gap:4px;
}
.act:active{transform:scale(.96)}
.act.fix{flex:1;background:linear-gradient(180deg,#FFC46A,#E68A26);color:#31190A;box-shadow:0 3px 0 #A9560F}
.act.fix:active{transform:translateY(2px);box-shadow:0 1px 0 #A9560F}
.act.fix.puzzle{background:linear-gradient(180deg,#5FE4D6,#26918A);color:#062421;box-shadow:0 3px 0 #17635D}
.act.fix.puzzle:active{box-shadow:0 1px 0 #17635D}
.act.del{width:56px;flex:0 0 auto;background:var(--panel-3);border:1px solid var(--line);font-size:15px}
.act.del small{font-family:var(--mono);font-size:10px;color:var(--muted)}
.act.esc{width:46px;flex:0 0 auto;background:var(--ink-2);border:1px solid var(--line);
  color:var(--muted);font-size:14px;flex-direction:column;gap:0;line-height:1.1}
.act.esc small{font-family:var(--mono);font-size:9px;color:var(--alarm)}
.act.off{opacity:.4}

/* diagnosis */
.diag-clue{
  background:var(--ink-2);border-left:3px solid var(--crt);border-radius:0 12px 12px 0;
  padding:11px 12px;margin:12px 0;font-size:13.5px;line-height:1.45;
}
.diag-clue span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--muted);margin-bottom:4px}
.diag-opt{
  width:100%;text-align:left;border-radius:13px;padding:13px;margin-top:8px;
  background:var(--panel);border:1px solid var(--line);font-family:var(--disp);font-weight:700;font-size:13.5px;
  line-height:1.3;transition:transform .08s,border-color .15s,background .15s;
}
.diag-opt:active{transform:scale(.98)}
.diag-opt.ok{border-color:var(--good);color:var(--good);background:rgba(95,211,122,.08)}
.diag-opt.bad{border-color:var(--alarm);color:var(--alarm);background:rgba(255,90,95,.08)}
.diag-timer{font-family:var(--mono);font-size:11px;text-align:center;color:var(--muted)}
.diag-timer b{color:var(--alarm)}

/* delegate picker */
.dpick h3{text-align:left}
.dpick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px;margin-top:8px}
.dpick.busy{opacity:.45}
.dpick .fit{margin-left:auto;text-align:right;font-family:var(--mono);font-size:11px}

/* admitting you are stuck */
.btn.giveup{
  background:var(--panel-3);border:1px solid #6B4450;color:var(--text);
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.btn.giveup span{
  font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.06em;color:var(--alarm);
}
.diag-answer{
  text-align:center;font-size:13px;color:var(--muted);margin:14px 0 4px;
  animation:pop .3s cubic-bezier(.2,1.5,.4,1);
}
.diag-answer b{color:var(--good);font-family:var(--disp);font-size:14px}
.diag-opt:disabled{opacity:.55}
.diag-opt.ok:disabled{opacity:1}

/* the rare ticket that actually needs working out */
.tier.tricky{
  color:var(--crt);border-color:var(--crt-dim);background:rgba(79,214,201,.1);
  animation:trickyGlow 2.4s ease-in-out infinite;
}
@keyframes trickyGlow{0%,100%{box-shadow:0 0 0 0 rgba(79,214,201,.35)}50%{box-shadow:0 0 0 4px rgba(79,214,201,0)}}
.tk.tricky{border-color:var(--crt-dim)}
.tk.tricky.urgent{border-color:var(--alarm)}

/* out of hands-on hours */
.res.allow.spent .bar>span{background:linear-gradient(90deg,#6B3438,var(--alarm))}
.res.allow.spent .lbl{color:var(--alarm)}
.spent-card{
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);border-radius:18px;padding:20px 16px;text-align:center;
}
.spent-ico{font-size:38px;margin-bottom:6px;filter:grayscale(.35)}
.spent-card h3{font-family:var(--disp);font-weight:800;font-size:17px;margin:0 0 6px}
.spent-card p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
.spent-clock{
  margin:14px auto 0;display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--ink-2);
}
.spent-clock b{color:var(--lamp);font-size:14px;font-family:var(--disp)}
.spent-idle{margin-top:14px!important;padding-top:12px;border-top:1px dashed var(--line);font-size:12px!important}
.spent-idle b{color:var(--crt)}

/* standard issue rack */
.issue-rack{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px}
.issue-slot{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 7px;
  text-align:center;transition:transform .08s ease,border-color .15s;min-width:0;
}
.issue-slot:active{transform:scale(.96)}
.issue-slot.filled{background:linear-gradient(180deg,var(--panel-2),var(--panel))}
.is-ico{font-size:20px;line-height:1}
.is-lbl{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--muted);margin-top:3px}
.is-item{
  font-family:var(--disp);font-weight:700;font-size:10.5px;margin-top:3px;line-height:1.2;color:var(--faint);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:25px;
}
.is-lv{font-family:var(--mono);font-size:8.5px;color:var(--muted);margin-top:2px}

/* why a level-up is not available yet */
.blocked{
  margin-top:6px;font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:var(--muted);
  text-align:center;line-height:1.45;
}

/* ---- staff: sorting, postings, department board ---- */
.idle-summary{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px;
}
.idle-summary>div{
  background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:8px 6px;text-align:center;
}
.idle-summary b{display:block;font-family:var(--mono);font-size:14px;color:var(--lamp);font-variant-numeric:tabular-nums}
.idle-summary span{font-size:9px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}

.sortbar{display:flex;align-items:center;gap:6px;padding:12px 12px 8px;overflow-x:auto;scrollbar-width:none}
.sortbar::-webkit-scrollbar{display:none}
.sortbar-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--muted);flex:0 0 auto}
.sortchip{
  flex:0 0 auto;border-radius:999px;padding:6px 12px;background:var(--panel);border:1px solid var(--line);
  font-family:var(--disp);font-weight:700;font-size:11.5px;color:var(--muted);transition:all .15s;
}
.sortchip.on{border-color:var(--lamp);color:var(--lamp);background:rgba(255,179,71,.1)}

.dchip-row{width:100%;text-align:left;margin-top:8px}
.dchip{
  display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;
  padding:4px 10px;font-size:11px;font-weight:700;background:var(--ink-2);color:var(--text);
}
.dchip.empty{color:var(--muted);border-style:dashed;font-weight:600}

.dept-list{display:flex;flex-direction:column;gap:9px;padding:0 12px}
.dept{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.dept.locked{opacity:.5}
.dept-head{display:flex;align-items:center;gap:10px}
.dept-ico{
  width:40px;height:40px;flex:0 0 auto;border-radius:12px;background:var(--ink-2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:20px;
}
.dept-head h3{font-family:var(--disp);font-weight:800;font-size:14.5px;margin:0;line-height:1.15}
.dept-bonus{font-size:11px;color:var(--crt)}
.dept-out{font-family:var(--mono);font-size:13px;color:var(--lamp);text-align:right;flex:0 0 auto}
.dept-out small{display:block;font-size:8.5px;color:var(--muted);letter-spacing:.04em}
.dept-blurb{margin:8px 0 0;font-size:11.5px;color:var(--muted);font-style:italic;line-height:1.35}
.dept-crew{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;min-height:44px;align-items:center}
.crew{position:relative;transition:transform .08s}
.crew:active{transform:scale(.94)}
.crew-fit{
  position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:8.5px;background:var(--ink-2);border:1px solid var(--line);
  border-radius:999px;padding:0 4px;color:var(--muted);
}
.crew-fit.good{color:var(--good);border-color:#2F6B41}
.crew-fit.poor{color:var(--alarm);border-color:#7A2F33}
.dept-empty{font-size:11.5px;color:var(--faint);font-style:italic}

.postopt{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;
  transition:transform .08s,border-color .15s;
}
.postopt:active{transform:scale(.98)}
.postopt.on{border-color:var(--lamp);background:rgba(255,179,71,.08)}
.postopt.off{opacity:.45}
.postopt h4{margin:0;font-family:var(--disp);font-weight:700;font-size:13.5px}
.fitbadge{
  flex:0 0 auto;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;
}
.fitbadge small{display:block;font-size:8px;letter-spacing:.06em}
.fitbadge.good{color:var(--good)} .fitbadge.poor{color:var(--alarm)}
.yieldbadge{
  flex:0 0 auto;font-family:var(--mono);font-size:12.5px;color:var(--text);
  text-align:right;line-height:1.3;max-width:44%;
}
/* one step brighter than --muted: the caption sits at 8-9px, where the muted
   tone is legible on paper and not on a phone at arm's length */
.yieldbadge small{display:block;font-size:9.5px;letter-spacing:.04em;color:#AEB7CC;
  font-family:var(--body);white-space:nowrap;margin-top:1px}
.yieldbadge.good{color:var(--good)}
.yieldbadge.good small{color:var(--good);opacity:.8}
.postopt .strand{color:var(--lamp);margin-top:3px;line-height:1.3}

/* a technician who has learned all the department can teach */
.avatar .lv.max{background:linear-gradient(180deg,#FFC46A,#E68A26);color:#31190A;font-weight:700}
.maxed{
  margin-top:12px;text-align:center;font-family:var(--disp);font-weight:800;font-size:13px;
  letter-spacing:.04em;color:var(--lamp);border:1px solid var(--lamp-dim);border-radius:13px;
  padding:12px;background:rgba(255,179,71,.08);
}

/* ---- staff: team header, chapters, ranks ---- */
.teamhead{
  display:flex;align-items:center;gap:10px;margin:12px 12px 8px;padding:14px;
  background:linear-gradient(135deg,#232C46,#1A2136);border:1px solid var(--line);border-radius:18px;
}
.th-main{flex:1;min-width:0}
.th-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--muted)}
.th-power{font-family:var(--disp);font-weight:800;font-size:32px;line-height:1.05;
  background:linear-gradient(180deg,#FFE0B0,var(--lamp));-webkit-background-clip:text;background-clip:text;color:transparent}
.th-side{display:flex;gap:8px;flex:0 0 auto}
.th-stat{background:var(--ink-2);border:1px solid var(--line);border-radius:13px;padding:8px 11px;text-align:center;min-width:58px}
.th-stat b{display:block;font-family:var(--disp);font-weight:800;font-size:17px;line-height:1.1}
.th-stat b.full{color:var(--alarm)}
.th-stat span{font-size:8px;color:var(--muted);letter-spacing:.06em}
.grade{font-size:22px!important}
.g-S{color:#FF5A9E} .g-A{color:var(--lamp)} .g-B{color:var(--good)}
.g-C{color:var(--crt)} .g-D{color:var(--muted)} .g-E{color:var(--faint)}
.teamstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px}
.teamstats>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 6px;text-align:center}
.teamstats b{display:block;font-family:var(--mono);font-size:13px;color:var(--crt)}
.teamstats span{font-size:8.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}

.chapter{
  margin:10px 12px 0;padding:13px;border-radius:18px;border:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
}
.chapter.ready{border-color:var(--lamp);box-shadow:0 0 0 1px rgba(255,179,71,.3),0 0 22px rgba(255,179,71,.14)}
.chapter-top{display:flex;align-items:center;gap:10px}
.chapter-ico{width:42px;height:42px;flex:0 0 auto;border-radius:13px;background:var(--ink-2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:21px}
.chapter-n{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--muted)}
.chapter-top h3{font-family:var(--disp);font-weight:800;font-size:16px;margin:0;line-height:1.15}
.chapter-caps{text-align:right;font-size:10px;color:var(--muted);flex:0 0 auto;line-height:1.5}
.chapter-caps b{color:var(--lamp);font-family:var(--mono);font-size:12px}
.chapter-goal{margin:9px 0 0;font-size:11.5px;color:var(--muted);font-style:italic}
.objs{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.obj{display:flex;align-items:center;gap:8px}
.obj-tick{
  width:18px;height:18px;flex:0 0 auto;border-radius:6px;border:1px solid var(--line);background:var(--ink-2);
  display:grid;place-items:center;font-size:11px;color:var(--good);
}
.obj.done .obj-tick{border-color:var(--good);background:rgba(95,211,122,.12)}
.obj-text{font-size:11.5px;line-height:1.3}
.obj.done .obj-text{color:var(--good)}
.obj-n{font-family:var(--mono);font-size:9.5px;color:var(--muted);flex:0 0 auto;font-variant-numeric:tabular-nums}
.chapter-next{margin:10px 0 0;font-size:11px;color:var(--crt);line-height:1.4}

.staffcard .rankline{font-size:11.5px;font-weight:700}
.badges{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:4px}
.rolechip{
  display:inline-flex;align-items:center;gap:4px;border:1px solid;border-radius:7px;padding:2px 7px;
  font-family:var(--disp);font-weight:700;font-size:10px;
}

/* cupboard groupings */
.grouphead{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--muted);
  padding:14px 14px 6px;display:flex;align-items:center;gap:7px;
}
.grouphead i{font-style:normal;background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:1px 7px;font-size:9px;color:var(--muted)}

/* ============================================================
   BATTLE — paid rooms and the games inside them
   ============================================================ */
.room{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);
  border-radius:17px;padding:12px}
.room-top{display:flex;align-items:center;gap:10px}
.room-ico{width:44px;height:44px;flex:0 0 auto;border-radius:13px;background:var(--ink-2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:22px}
.room-top h3{font-family:var(--disp);font-weight:800;font-size:15px;margin:0;line-height:1.15}
.room-sub{font-size:11px;color:var(--muted)}
.room-sub b{color:var(--lamp);font-family:var(--mono)}
.room-stake{text-align:right;flex:0 0 auto}
.room-stake b{display:block;font-family:var(--mono);font-size:13px;color:var(--lamp)}
.room-stake small{font-size:8.5px;color:var(--muted);letter-spacing:.05em}
.room-blurb{margin:9px 0 0;font-size:11.5px;color:var(--muted);line-height:1.35;font-style:italic}
.ladder{margin-top:9px;background:var(--ink-2);border:1px solid var(--line);border-radius:11px;padding:6px 8px}
.ladder.empty-l{font-size:11px;color:var(--faint);text-align:center;padding:10px;font-style:italic}
.lrow{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px}
.lrow.me{color:var(--lamp)}
.lpos{font-family:var(--mono);font-size:10px;color:var(--muted);width:14px}
.lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltime{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.room-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.recent{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);padding:4px 0}
.recent b{color:var(--text)}

.bgame{padding:2px 0}
.bg-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.bg-head h3{font-family:var(--disp);font-weight:800;font-size:16px;margin:0;text-align:left}
.bg-sub{font-size:11px;color:var(--muted)}
.bg-clock{font-family:var(--mono);font-size:17px;color:var(--lamp);margin-left:auto;
  font-variant-numeric:tabular-nums;flex:0 0 auto}
.bg-bar{height:4px;border-radius:2px;background:#0B0F1C;overflow:hidden;margin-bottom:12px}
.bg-bar>span{display:block;height:100%;background:linear-gradient(90deg,#3FA9C9,var(--crt));transition:width .3s}
.bq{font-family:var(--disp);font-weight:700;font-size:15px;line-height:1.35;margin:0 0 12px;text-align:left}
.bopt{display:block;width:100%;text-align:left;border-radius:13px;padding:12px;margin-top:8px;
  background:var(--panel);border:1px solid var(--line);font-family:var(--body);font-weight:600;
  font-size:13.5px;line-height:1.3;transition:transform .07s,border-color .15s,background .15s}
.bopt:active{transform:scale(.985)}
.bopt.right{border-color:var(--good);background:rgba(95,211,122,.1);color:var(--good)}
.bopt.wrong{border-color:var(--alarm);background:rgba(255,90,95,.1);color:var(--alarm)}
.bopt:disabled{opacity:.85}
.bg-note{margin:12px 0 0;font-size:10.5px;color:var(--faint);text-align:center;font-family:var(--mono)}

.rack{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 4px}
.led-btn{height:62px;border-radius:14px;background:var(--ink-2);border:2px solid var(--line);
  transition:all .12s}
.led-btn.lit{background:radial-gradient(circle at 50% 40%,#DFFCF7,var(--crt));border-color:var(--crt);
  box-shadow:0 0 22px rgba(79,214,201,.6)}
.led-btn:not(:disabled):active{transform:scale(.95)}

.scram{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.scram span{width:34px;height:42px;border-radius:9px;background:var(--panel-3);border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:19px}
.bg-input{width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:12px;
  color:var(--text);font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.08em;text-align:center}
.bg-input:focus{outline:none;border-color:var(--crt)}
.bg-input.bad{border-color:var(--alarm);animation:shake .4s}

.cfg{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:6px;overflow-x:auto}
.cfgline{display:block;width:100%;text-align:left;font-family:var(--mono);font-size:11.5px;
  padding:9px 10px;border-radius:8px;white-space:pre;color:var(--text);transition:background .12s}
.cfgline:active{background:var(--panel-3)}
.cfgline.right{background:rgba(95,211,122,.14);color:var(--good)}
.cfgline.wrong{background:rgba(255,90,95,.12);color:var(--alarm);opacity:.6}
.bigtime{font-family:var(--disp);font-weight:800;font-size:38px;text-align:center;color:var(--lamp);margin:6px 0}

/* multi-select in the cupboard */
.card.item.picked{background:linear-gradient(180deg,rgba(79,214,201,.10),var(--panel))}
.tick{
  width:22px;height:22px;flex:0 0 auto;border-radius:7px;border:1.5px solid var(--line);
  background:var(--ink-2);display:grid;place-items:center;font-size:12px;color:var(--crt);margin-top:2px;
}
.tick.on{border-color:var(--crt);background:rgba(79,214,201,.15)}
.pickall{
  margin-left:auto;font-family:var(--body);font-size:10px;color:var(--crt);
  border:1px solid var(--crt-dim);border-radius:999px;padding:2px 9px;background:transparent;
}
#bulkbar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom,0px));
  z-index:55;width:min(456px,calc(100% - 24px));
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--crt-dim);border-radius:15px;box-shadow:0 -6px 24px rgba(0,0,0,.5);
  animation:toastIn .25s cubic-bezier(.2,1.3,.4,1);
}
.bulk-n{flex:1;font-size:12.5px;color:var(--muted)}
.bulk-n b{font-family:var(--disp);font-size:17px;color:var(--text)}
#bulkbar .btn{flex:0 0 auto}

/* the item fitted in a standard slot, upgradeable in place */
.fitted{
  background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:12px;
}
.fitted-top{display:flex;align-items:flex-start;gap:10px}
.fitted-top h4{margin:0 0 4px;font-family:var(--disp);font-weight:800;font-size:15px;line-height:1.2;text-align:left}
.fitted-lv{text-align:right;flex:0 0 auto}
.fitted-lv b{display:block;font-family:var(--disp);font-size:17px;color:var(--lamp)}
.fitted-lv small{font-size:8.5px;color:var(--muted);letter-spacing:.05em}
.lvbar{height:6px;border-radius:3px;background:#0B0F1C;overflow:hidden;margin-top:9px;border:1px solid #080B14}
.lvbar>span{display:block;height:100%;background:linear-gradient(90deg,#C9772A,var(--lamp));transition:width .35s}
.fitted .cta{width:100%;margin-top:11px}
.sortchip i{font-style:normal;opacity:.6;font-size:10px;margin-left:2px}
.card.owned{opacity:.72}
.ownedtag{
  font-family:var(--mono);font-size:9.5px;color:var(--good);border:1px solid #2F6B41;
  background:rgba(95,211,122,.1);border-radius:7px;padding:4px 8px;flex:0 0 auto;white-space:nowrap;
}

/* how well the roles are covered — the reason not to hire nine of one person */
.spread-strip{
  display:flex;align-items:center;gap:10px;margin:8px 12px 0;padding:9px 11px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
}
.spread-strip.full{border-color:var(--good);background:linear-gradient(180deg,rgba(95,211,122,.08),var(--panel))}
.spread-roles{display:flex;gap:4px;flex:0 0 auto}
.rdot{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;
  border:1px solid var(--line);background:var(--ink-2);filter:grayscale(1) opacity(.4);
}
.rdot.on{filter:none}
.spread-txt{flex:1;min-width:0}
.spread-txt b{display:block;font-family:var(--disp);font-size:12.5px}
.spread-txt span{font-size:10.5px;color:var(--muted);line-height:1.3}
.spread-mult{font-family:var(--mono);font-size:15px;color:var(--lamp);flex:0 0 auto}

/* the one thing worth doing next */
.nextmove{
  margin:10px 12px 0;padding:13px;border-radius:17px;border:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
}
.nextmove.warn{border-color:var(--lamp);box-shadow:0 0 0 1px rgba(255,179,71,.22)}
.nextmove.idea{border-color:var(--crt-dim)}
.nextmove.good{border-color:#2F6B41}
.nm-top{display:flex;align-items:center;gap:11px}
.nm-ico{
  width:42px;height:42px;flex:0 0 auto;border-radius:13px;background:var(--ink-2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:21px;
}
.nm-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--muted)}
.nm-top h3{font-family:var(--disp);font-weight:800;font-size:15px;margin:1px 0 0;line-height:1.2}
.nm-detail{margin:9px 0 0;font-size:11.5px;color:var(--muted);line-height:1.4}
.nextmove .cta{width:100%;margin-top:11px}
.dchip.good{border-color:#2F6B41}
.dchip.poor{border-color:rgba(240,169,74,.45)}
.dchip .fitn{font-family:var(--mono);font-size:10.5px;opacity:.85;margin-left:auto;padding-left:8px}
.dchip.good .fitn{color:var(--good);opacity:1}
.dchip.poor .fitn{color:var(--text);opacity:1}
.dchip em{font-style:normal;margin-left:6px;font-size:10px;font-family:var(--mono);
  color:var(--lamp);background:rgba(240,169,74,.13);border:1px solid rgba(240,169,74,.38);
  border-radius:5px;padding:1px 4px;white-space:nowrap}

/* a rank crossing is a moment, not a line of toast */
.promo{text-align:center;position:relative;padding-top:6px}
.promo-ribbon{
  display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:#31190A;
  background:linear-gradient(180deg,#FFC46A,#E68A26);border-radius:999px;padding:4px 14px;margin-bottom:12px;
}
.promo-art{
  width:96px;height:96px;margin:0 auto 10px;border-radius:26px;overflow:hidden;
  background:radial-gradient(circle at 50% 20%,#2C3552,#161C2E);border:2px solid var(--lamp);
  box-shadow:0 0 30px rgba(255,179,71,.35);animation:pop .45s cubic-bezier(.2,1.6,.4,1);
}

<script>
/* ============================================================
   IT EMPIRE — DATA LAYER
   Pure content. No logic. Add rows here to extend the game.
   ============================================================ */
const DATA = (() => {

  /* ---------- RARITY ---------- */
  const RARITY = {
    COMMON:    { key:'COMMON',    label:'COMMON',    mult:1.00, color:'#8A93AD', order:0 },
    UNCOMMON:  { key:'UNCOMMON',  label:'UNCOMMON',  mult:1.15, color:'#5FD37A', order:1 },
    RARE:      { key:'RARE',      label:'RARE',      mult:1.35, color:'#4FA8FF', order:2 },
    EPIC:      { key:'EPIC',      label:'EPIC',      mult:1.60, color:'#B67CFF', order:3 },
    LEGENDARY: { key:'LEGENDARY', label:'LEGENDARY', mult:2.00, color:'#FFB347', order:4 },
    MYTHIC:    { key:'MYTHIC',    label:'MYTHIC',    mult:2.60, color:'#FF5A9E', order:5 },
  };

  /* ---------- STATS ---------- */
  const STATS = ['TECHNICAL','SPEED','COMMUNICATION','INVESTIGATION','PATIENCE','AUTOMATION','MANAGEMENT'];
  const STAT_ICON = {
    TECHNICAL:'🔧', SPEED:'⚡', COMMUNICATION:'💬', INVESTIGATION:'🔍',
    PATIENCE:'🧘', AUTOMATION:'🤖', MANAGEMENT:'📊'
  };

  /* ---------- CAREER TITLES ---------- */
  const TITLES = [
    { level:1,  name:'Junior IT Technician' },
    { level:5,  name:'IT Support Technician' },
    { level:12, name:'Senior Technician' },
    { level:20, name:'Team Lead' },
    { level:30, name:'IT Manager' },
    { level:42, name:'Regional IT Manager' },
    { level:55, name:'Global IT Director' },
    { level:70, name:'Chief Technology Officer' },
  ];

  /* ---------- REPUTATION RANKS ---------- */
  const RANKS = [
    { at:0,      name:'Nobody Knows You',        blurb:'People still ask you where the printer is.' },
    { at:100,    name:'Reliable Technician',     blurb:'Your name is written on a sticky note somewhere.' },
    { at:500,    name:'IT Hero',                 blurb:'Managers say your name in meetings. Fondly.' },
    { at:2000,   name:'Office Legend',           blurb:'People queue at your desk with snacks.' },
    { at:10000,  name:'The One Who Fixes Everything', blurb:'You are the escalation path. All of it.' },
    { at:100000, name:'IT God',                  blurb:'Servers reboot themselves out of respect.' },
  ];

  /* ---------- TICKETS ----------
     cat: hardware | display | network | software | access | security | vip
     stat: the stat that decides technical success
     clue: what you can actually see — the diagnosis is played off this
     causes: three candidates, exactly one right. Reading the clue beats
             guessing, which is the whole point.                           */
  const TICKETS = {
    EASY: [
      { name:'Printer Offline', cat:'hardware', stat:'PATIENCE', icon:'🖨️', user:'Reception',
        clue:'Queue has 31 jobs. The printer is showing a green light.',
        causes:[{t:"The print spooler has hung",ok:1},{t:"It is out of paper",ok:0},{t:"It needs a new toner cartridge",ok:0}],
        why:'A green light means the printer is fine. The jobs are stacking on the computer\'s side, so the fault is the queue, not the machine. Clear the spooler and all 31 jobs release at once.' },
      { name:'Wi-Fi Not Connected', cat:'network', stat:'TECHNICAL', icon:'📶', user:'Sales',
        clue:'Connects on their phone. Not on the laptop.',
        causes:[{t:"The laptop is clinging to a stale saved profile",ok:1},{t:"The router is broken",ok:0},{t:"They are out of mobile data",ok:0}],
        why:'The phone connects, so the Wi-Fi itself works. Only the laptop is wrong, and the usual reason is a saved network profile holding an old password or setting. Forget the network and rejoin.' },
      { name:'No Audio In Headset', cat:'hardware', stat:'INVESTIGATION', icon:'🎧', user:'Support',
        clue:'Green light on the headset. Silence in the app.',
        causes:[{t:"The app is pointed at the wrong output device",ok:1},{t:"The headset has died",ok:0},{t:"The volume is muted at the wall",ok:0}],
        why:'The headset has power, so it is not dead. Sound is going somewhere else — apps keep their own output setting, separate from the system\'s. Point the app at the headset.' },
      { name:'Monitor Not Detected', cat:'display', stat:'TECHNICAL', icon:'🖥️', user:'Finance',
        clue:'Second screen black since they moved desks.',
        causes:[{t:"The cable went back into the wrong port in the move",ok:1},{t:"The monitor died in the move",ok:0},{t:"Windows needs reinstalling",ok:0}],
        why:'It worked before the desk move and nothing else changed. When a fault starts right after someone unplugged and replugged things, suspect the cable and the port before the hardware.' },
      { name:'Keyboard Not Working', cat:'hardware', stat:'PATIENCE', icon:'⌨️', user:'HR',
        clue:'Every key works except the ones they need.',
        causes:[{t:"There is something under the keycaps",ok:1},{t:"The driver is out of date",ok:0},{t:"It needs charging",ok:0}],
        why:'Some keys work, so the keyboard is connected and the driver is fine. A fault that affects only certain keys is physical — crumbs, dust or a drink under those keycaps.' },
      { name:'Password Expired', cat:'access', stat:'COMMUNICATION', icon:'🔑', user:'Marketing',
        clue:'They have tried the old one eleven times.',
        causes:[{t:"Eleven attempts have now locked the account",ok:1},{t:"The keyboard layout changed",ok:0},{t:"The domain is down",ok:0}],
        why:'Eleven wrong attempts is the real story. Most systems lock an account after a handful of failures, so the lockout is now the problem, not the password. Unlock first, then reset.' },
      { name:'Screen Is Upside Down', cat:'display', stat:'COMMUNICATION', icon:'🙃', user:'Legal',
        clue:'They leaned on the keyboard. They deny leaning on the keyboard.',
        causes:[{t:"Ctrl+Alt+Arrow rotated the display",ok:1},{t:"The graphics card is failing",ok:0},{t:"The monitor is mounted wrong",ok:0}],
        why:'Windows rotates the display with Ctrl+Alt+Arrow, and it is very easy to hit by accident. A graphics card failing looks like artefacts or a black screen, not a neat 180-degree flip.' },
      { name:'Laptop "Very Slow"', cat:'software', stat:'PATIENCE', icon:'🐌', user:'Ops',
        clue:'Ninety-four browser tabs. Uptime: 61 days.',
        causes:[{t:"It has not been restarted since April",ok:1},{t:"It needs a bigger hard drive",ok:0},{t:"The wifi is slow",ok:0}],
        why:'Sixty-one days without a restart and ninety-four tabs. Memory fills up and never gets released. Restarting costs two minutes and fixes more slow laptops than any other single action.' },
      { name:'Mouse Battery Mystery', cat:'hardware', stat:'INVESTIGATION', icon:'🖱️', user:'Design',
        clue:'Works when held at a very specific angle.',
        causes:[{t:"The battery contact spring has lost its tension",ok:1},{t:"The desk is the wrong colour for the sensor",ok:0},{t:"The USB port is faulty",ok:0}],
        why:'Working at one specific angle is the clue. That is a physical contact problem — gravity is completing the circuit. A flat battery would not work at any angle.' },
      { name:'Cannot Find The Desktop', cat:'software', stat:'COMMUNICATION', icon:'🗂️', user:'Reception',
        clue:'They saved it "to the desktop". They were in a remote session.',
        causes:[{t:"It is on the remote desktop, not theirs",ok:1},{t:"The file was deleted",ok:0},{t:"Desktop icons are hidden",ok:0}],
        why:'Their files are fine; they are looking at a different computer. Remote desktop sessions have their own desktop, and it is easy to forget which machine you are actually looking at.' },
      { name:'Camera Shows Only Ceiling', cat:'display', stat:'COMMUNICATION', icon:'📹', user:'Marketing',
        clue:'A perfect view of the ceiling tiles. For the entire call.',
        causes:[{t:'The laptop is open on a stand behind them',ok:1},{t:'The camera has failed',ok:0},{t:'The driver is missing',ok:0}],
        why:'The camera works, it is just aimed wrong. A laptop propped on a stand points its camera upward. Move the laptop, not the settings.' },
      { name:'Everything Is In German', cat:'software', stat:'INVESTIGATION', icon:'🇩🇪', user:'Accounts',
        clue:'Menus changed language overnight. They insist they touched nothing.',
        causes:[{t:'The display language was switched in settings',ok:1},{t:'A virus',ok:0},{t:'The keyboard is German',ok:0}],
        why:'Nothing is broken — a setting was changed. Display language sits in system settings and can be changed with a stray click. Change it back and everything returns.' },
      { name:'Chair Will Not Go Up', cat:'hardware', stat:'PATIENCE', icon:'🪑', user:'Legal',
        clue:'Not strictly IT. They logged it anyway. It is under your desk now.',
        causes:[{t:'This is a facilities job, not yours',ok:1},{t:'The gas cylinder needs a driver',ok:0},{t:'It needs a firmware update',ok:0}],
        why:'Not every request that reaches IT is an IT problem. Recognising what belongs to facilities, HR or someone else — and handing it over politely — is part of the job.' },
      { name:'Printing To The Wrong Floor', cat:'hardware', stat:'COMMUNICATION', icon:'🖨️', user:'Ops',
        clue:'Everything comes out on the third floor. They sit on the first.',
        causes:[{t:'Their default printer is still the old floor',ok:1},{t:'The printer was moved',ok:0},{t:'Their account is wrong',ok:0}],
        why:'The pages are printing perfectly, just somewhere else. When someone moves desks, the default printer follows them until it is changed.' },
      { name:'The Cursor Has Vanished', cat:'hardware', stat:'INVESTIGATION', icon:'👻', user:'Design',
        clue:'The mouse moves. No cursor anywhere. Their second monitor is switched off.',
        causes:[{t:'The cursor is on the screen they turned off',ok:1},{t:'The mouse is dead',ok:0},{t:'The graphics driver crashed',ok:0}],
        why:'The mouse moves, so the mouse works. If the computer thinks a second screen is still attached, the cursor can sit on a monitor that is switched off.' },
      { name:'It Says I Am Away', cat:'software', stat:'COMMUNICATION', icon:'🟡', user:'Sales',
        clue:'They are very much at their desk, and slightly offended about it.',
        causes:[{t:'Status is stuck from a locked session elsewhere',ok:1},{t:'The app is broken',ok:0},{t:'The network is slow',ok:0}],
        why:'Presence status comes from the session, not the person. A session left locked on another machine keeps reporting away. Sign that session out.' },
    ],
    MEDIUM: [
      { name:'VPN Failure', cat:'network', stat:'TECHNICAL', icon:'🔐', user:'Remote Team',
        clue:'Connects, holds for four seconds, drops. Only from home.',
        causes:[{t:'MTU mismatch on the tunnel',ok:1},{t:'Their password expired',ok:0},{t:'The laptop needs more RAM',ok:0}],
        why:'The tunnel connects but large packets vanish. That is a classic MTU problem — the packet is too big to fit once the VPN adds its own wrapper, so it is silently dropped. Lower the MTU.' },
      { name:'Outlook Sync Problem', cat:'software', stat:'INVESTIGATION', icon:'📧', user:'Sales',
        clue:'Sent items still sync. The inbox stopped three days ago.',
        causes:[{t:'The mailbox is over quota',ok:1},{t:'The keyboard is faulty',ok:0},{t:'DNS is down company-wide',ok:0}],
        why:'Mail sends but does not arrive. A mailbox at its storage limit accepts nothing new. Check the quota before touching the client.' },
      { name:'Certificate Error', cat:'security', stat:'TECHNICAL', icon:'📜', user:'Finance',
        clue:'One machine only. Everyone else on the floor is fine.',
        causes:[{t:'Their clock is fourteen minutes fast',ok:1},{t:'The website has expired',ok:0},{t:'Their account is locked',ok:0}],
        why:'Certificates are only valid between two dates, so the computer\'s clock decides whether they look valid. A clock fourteen minutes out can make every secure site look untrustworthy.' },
      { name:'BitLocker Recovery', cat:'security', stat:'PATIENCE', icon:'🔒', user:'Field Staff',
        clue:'Asking for a 48-digit key right after a firmware update.',
        causes:[{t:'The TPM lost its seal in the BIOS update',ok:1},{t:'They typed the password wrong',ok:0},{t:'The disk has failed',ok:0}],
        why:'The drive is encrypted and the chip that holds the key checks the machine has not changed. A BIOS update looks like a change, so it asks for the recovery key.' },
      { name:'External Display Failure', cat:'display', stat:'TECHNICAL', icon:'📺', user:'Meeting Rm 3',
        clue:'Works at their desk. Dead in the meeting room.',
        causes:[{t:'Room cable is HDMI, the dock outputs DisplayPort',ok:1},{t:'The monitor is broken',ok:0},{t:'The graphics driver is old',ok:0}],
        why:'Both ends work, the connection between them does not. HDMI and DisplayPort are different shapes carrying different signals. An adapter, not a repair.' },
      { name:'Software Install Failure', cat:'software', stat:'INVESTIGATION', icon:'💿', user:'Engineering',
        clue:'Installer reaches 94%, rolls back, reports nothing.',

    const n = parseInt(hex.slice(1), 16);
    if (!Number.isFinite(n)) return hex;
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.max(0, Math.min(255, Math.round(r + amt)));
    g = Math.max(0, Math.min(255, Math.round(g + amt)));
    b = Math.max(0, Math.min(255, Math.round(b + amt)));
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
